<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ToDo 체크시트 v1</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
            background-color: #eaf6ff; /* 파스텔 하늘색 */
        }

        h2 {
            text-align: center;
        }

        input {
            padding: 10px;
            font-size: 16px;
            width: 70%;
        }

        button {
            padding: 10px;
        }

        ul {
            margin-top: 20px;
        }

        li {
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

<h2>ToDo 체크시트 v1</h2>

<input id="input-box" placeholder="할 일을 입력하세요">
<button onclick="addTodo()">추가</button>

<ul id="list"></ul>

<script>
let todos = JSON.parse(localStorage.getItem('todos')) || [];

// 화면에 그리기
function render() {
    const list = document.getElementById('list');
    list.innerHTML = "";

    todos.forEach(todo => {
        const li = document.createElement('li');
        li.innerText = todo;
        list.appendChild(li);
    });
}

// 추가
function addTodo() {
    const input = document.getElementById('input-box');
    const text = input.value.trim();

    if (text === "") return;

    todos.push(text);

    // 저장
    localStorage.setItem('todos', JSON.stringify(todos));

    input.value = "";
    render();
}

// 처음 들어올 때 실행
render();
</script>

</body>
</html>
