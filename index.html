<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Todo 체크리스트</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #eaf6ff; /* 파스텔 하늘색 */
            padding: 40px 20px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        h2 {
            text-align: center;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .input-area {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #ddd;
            font-size: 15px;
        }

        button {
            padding: 12px 16px;
            border-radius: 10px;
            border: none;
            background-color: #4f8cff;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #3a6fd8;
        }

        ul {
            margin-top: 20px;
            padding: 0;
        }

        li {
            list-style: none;
            padding: 12px;
            margin-bottom: 10px;
            background: white;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            cursor: grab;
            transition: 0.2s;
        }

        li:hover {
            transform: translateY(-2px);
        }

        .number {
            width: 25px;
            color: #888;
        }

        .text {
            flex: 1;
            cursor: pointer;
        }

        .done {
            text-decoration: line-through;
            color: #aaa;
        }

        .dragging {
            opacity: 0.5;
        }
    </style>
</head>
<body>

<div class="container">

<h2>Todo 체크리스트</h2>

<div class="input-area">
    <input id="input-box" placeholder="할 일을 입력하세요">
    <button onclick="addTodo()">추가</button>
</div>

<ul id="list"></ul>

</div>

<script>
let todos = JSON.parse(localStorage.getItem('todos')) || [];

function save() {
    localStorage.setItem('todos', JSON.stringify(todos));
}

function render() {
    const list = document.getElementById('list');
    list.innerHTML = "";

    todos.forEach((todo, index) => {
        const li = document.createElement('li');
        li.draggable = true;
        li.dataset.index = index;

        li.addEventListener('dragstart', () => {
            li.classList.add('dragging');
        });

        li.addEventListener('dragend', () => {
            li.classList.remove('dragging');
        });

        // 번호
        const number = document.createElement('span');
        number.className = "number";
        number.innerText = index + 1;

        // 텍스트
        const span = document.createElement('span');
        span.className = "text";
        span.innerText = todo.text || todo;

        if (todo.done) span.classList.add('done');

        span.onclick = () => {
            if (typeof todos[index] === "string") {
                todos[index] = { text: todo, done: false };
            }
            todos[index].done = !todos[index].done;
            save();
            render();
        };

        // 삭제 버튼
        const delBtn = document.createElement('button');
        delBtn.innerText = "삭제";
        delBtn.onclick = () => {
            todos.splice(index, 1);
            save();
            render();
        };

        li.appendChild(number);
        li.appendChild(span);
        li.appendChild(delBtn);
        list.appendChild(li);
    });
}

// 드래그 위치 계산
function getAfterElement(y) {
    const items = [...document.querySelectorAll('#list li:not(.dragging)')];

    return items.reduce((closest, child) => {
        const box = child.getBoundingClientRect();
        const offset = y - box.top - box.height / 2;

        if (offset < 0 && offset > closest.offset) {
            return { offset: offset, element: child };
        } else {
            return closest;
        }
    }, { offset: Number.NEGATIVE_INFINITY }).element;
}

const list = document.getElementById('list');

list.addEventListener('dragover', (e) => {
    e.preventDefault();
    const dragging = document.querySelector('.dragging');
    const after = getAfterElement(e.clientY);

    if (!dragging) return;

    if (after == null) {
        list.appendChild(dragging);
    } else {
        list.insertBefore(dragging, after);
    }
});

list.addEventListener('drop', () => {
    const newTodos = [];

    document.querySelectorAll('#list li').forEach(li => {
        const idx = li.dataset.index;
        newTodos.push(todos[idx]);
    });

    todos = newTodos;
    save();
    render();
});

// 추가
function addTodo() {
    const input = document.getElementById('input-box');
    const text = input.value.trim();

    if (text === "") return;

    todos.push({ text: text, done: false });
    input.value = "";

    save();
    render();
}

// 엔터 추가
document.getElementById('input-box').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
        addTodo();
    }
});

render();
</script>

</body>
</html>
