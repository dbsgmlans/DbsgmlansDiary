<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ToDo 체크시트 v1</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
        }

        h2 {
            text-align: center;
        }

        input {
            padding: 10px;
            font-size: 16px;
            width: 70%;
        }

        button {
            padding: 10px;
        }

        ul {
            margin-top: 20px;
        }
    </style>
</head>
<body>

<h2>ToDo 체크시트 v1</h2>

<input id="input-box" placeholder="할 일을 입력하세요">
<button onclick="addTodo()">추가</button>

<ul id="list"></ul>

<script>
function addTodo() {
    const input = document.getElementById('input-box');
    const text = input.value;

    if (text === "") return;

    const li = document.createElement('li');
    li.innerText = text;

    document.getElementById('list').appendChild(li);

    input.value = "";
}
</script>

</body>
</html>
