<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Todo 체크리스트</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
            background-color: #eaf6ff;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        h2 {
            text-align: center;
        }

        /* ⭐ 입력창 + 버튼 한 줄 정렬 */
        .input-area {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 10px;
            font-size: 16px;
        }

        button {
            padding: 10px;
        }

        ul {
            margin-top: 20px;
            padding: 0;
        }

        li {
            list-style: none;
            padding: 10px;
            margin-bottom: 8px;
            background: white;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: grab;
        }

        .dragging {
            opacity: 0.5;
        }
    </style>
</head>
<body>

<div class="container">

<h2>Todo 체크리스트</h2>

<div class="input-area">
    <input id="input-box" placeholder="할 일을 입력하세요">
    <button onclick="addTodo()">추가</button>
</div>

<ul id="list"></ul>

</div>

<script>
let todos = JSON.parse(localStorage.getItem('todos')) || [];

function save() {
    localStorage.setItem('todos', JSON.stringify(todos));
}

function render() {
    const list = document.getElementById('list');
    list.innerHTML = "";

    todos.forEach((todo, index) => {
        const li = document.createElement('li');
        li.draggable = true;
        li.dataset.index = index;

        li.addEventListener('dragstart', () => {
            li.classList.add('dragging');
        });

        li.addEventListener('dragend', () => {
            li.classList.remove('dragging');
        });

        const span = document.createElement('span');
        span.innerText = todo;

        const delBtn = document.createElement('button');
        delBtn.innerText = "삭제";
        delBtn.onclick = () => {
            todos.splice(index, 1);
            save();
            render();
        };

        li.appendChild(span);
        li.appendChild(delBtn);
        list.appendChild(li);
    });
}

function getAfterElement(y) {
    const items = [...document.querySelectorAll('#list li:not(.dragging)')];

    return items.reduce((closest, child) => {
        const box = child.getBoundingClientRect();
        const offset = y - box.top - box.height / 2;

        if (offset < 0 && offset > closest.offset) {
            return { offset: offset, element: child };
        } else {
            return closest;
        }
    }, { offset: Number.NEGATIVE_INFINITY }).element;
}

const list = document.getElementById('list');

list.addEventListener('dragover', (e) => {
    e.preventDefault();
    const dragging = document.querySelector('.dragging');
    const after = getAfterElement(e.clientY);

    if (!dragging) return;

    if (after == null) {
        list.appendChild(dragging);
    } else {
        list.insertBefore(dragging, after);
    }
});

list.addEventListener('drop', () => {
    const newTodos = [];

    document.querySelectorAll('#list li').forEach(li => {
        const idx = li.dataset.index;
        newTodos.push(todos[idx]);
    });

    todos = newTodos;
    save();
    render();
});

function addTodo() {
    const input = document.getElementById('input-box');
    const text = input.value.trim();

    if (text === "") return;

    todos.push(text);
    input.value = "";

    save();
    render();
}

document.getElementById('input-box').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
        addTodo();
    }
});

render();
</script>

</body>
</html>
