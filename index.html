<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>나의 첫 웹사이트 - 메모장</title>
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
        #memo-area { 
            width: 100%; 
            height: 200px; 
            margin-top: 10px; 
            padding: 10px;
            border: 2px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }
        .status { font-size: 0.8em; color: #666; margin-top: 5px; }
    </style>
</head>
<body>
    <h1>성공입니다!</h1>
    <p>10번의 컵 맞히기 시련을 뚫고 만든 사이트예요.</p>
    
    <hr>

    <h3>📌 나만의 작은 메모장</h3>
    <textarea id="memo-area" placeholder="여기에 메모를 남기세요... (자동 저장됩니다)"></textarea>
    <div class="status" id="save-status">내용이 안전하게 저장되었습니다.</div>

    <script>
        const memoArea = document.getElementById('memo-area');
        const status = document.getElementById('save-status');

        // 1. 페이지 로드 시 저장된 메모 불러오기
        memoArea.value = localStorage.getItem('myWebMemo') || "";

        // 2. 타이핑할 때마다 로컬 스토리지에 자동 저장
        memoArea.addEventListener('input', () => {
            localStorage.setItem('myWebMemo', memoArea.value);
            status.innerText = "입력 중...";
            
            // 입력 멈추고 0.5초 뒤에 메시지 변경
            clearTimeout(window.saveTimer);
            window.saveTimer = setTimeout(() => {
                status.innerText = "자동 저장 완료!";
            }, 500);
        });
    </script>
</body>
</html>
